    Thickness: {USL: 105.0, LSL: 95.0}
    Refractive_Index: {USL: 1.55, LSL: 1.45}

wafer_map:
  raw_dir: "data/raw/wafer_maps"
  processed_dir: "data/silver/wafer_features"

predict:
  model_dir: "data/gold/models"
  output_dir: "data/gold/predictions"