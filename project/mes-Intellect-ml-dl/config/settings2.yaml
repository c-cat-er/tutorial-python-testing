data_lake:
  raw: "data/raw"
  bronze: "data/bronze"
  silver: "data/silver"
  gold: "data/gold"

traceability:
  id_format: "{LotID}_{WaferID}_{DieID}"

mes:
  log_dir: "data/raw/mes_logs"
  output_dir: "data/bronze/mes_cleaned"

