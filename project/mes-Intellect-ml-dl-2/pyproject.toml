[project]
name = "semiconductor-yield-platform"
version = "0.1.0"
description = "Unified MES/NPI/WaferMap/Yield Prediction Platform"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "shap>=0.44",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "pyarrow>=14.0",
    "openpyxl>=3.1",
    "opencv-python-headless>=4.9",
    "torch>=2.0",
    "torchvision>=0.15",
    "tqdm>=4.65",  # 進度條
    "optuna>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]