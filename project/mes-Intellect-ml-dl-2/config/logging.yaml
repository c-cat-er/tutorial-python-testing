version: 1
formatters:
    standard:
        format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
handlers:
    console:
        class: logging.StreamHandler
        formatter: standard
    file:
        class: logging.handlers.RotatingFileHandler # 升級為輪替處理程序
        filename: logs/app.log
        formatter: standard
        maxBytes: 10485760 # 10MB 自動切分
        backupCount: 5 # 最多保留 5 個舊 Log 檔
root:
    level: INFO
    handlers: [console, file]
